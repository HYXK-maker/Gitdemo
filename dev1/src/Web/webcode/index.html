<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 顶部导航 */
        header {
            height: 60px;
            background: #2c3e50;
            color: #fff;

        /* 主体容器 */
        .container {
            width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;

        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<header>

</header>

<!-- 主体内容区 -->
<div class="container">

</div>

</html>
